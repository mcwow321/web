<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Girlfriend/My Boyfriend??</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .hearts {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            font-size: 20px;
            color: rgba(255, 182, 193, 0.7);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            position: relative;
            z-index: 2;
            transform: scale(0);
            animation: scaleIn 0.8s ease-out 0.5s forwards;
        }

        @keyframes scaleIn {
            to { transform: scale(1); }
        }

        .question {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 40px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
        }

        .btn:hover:before {
            width: 300px;
            height: 300px;
        }

        .btn-yes {
            background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .btn-yes:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(255, 107, 107, 0.6);
        }

        .btn-no {
            background: linear-gradient(45deg, #74b9ff, #0984e3);
            color: white;
            box-shadow: 0 10px 25px rgba(116, 185, 255, 0.4);
        }

        .btn-no:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(116, 185, 255, 0.6);
        }

        .message {
            font-size: 1.5em;
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            display: none;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .happy-message {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            color: #2c3e50;
            border: 3px solid #ff6b6b;
        }

        .sad-message {
            background: linear-gradient(45deg, #a8edea, #fed6e3);
            color: #2c3e50;
            border: 3px solid #74b9ff;
        }

        .celebration {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #ff6b6b;
            animation: confetti-fall 3s linear infinite;
        }

        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            border-radius: 50%;
            animation: sparkle 1.5s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <h1 class="question">Will You Be My Girlfriend/My Boyfriend? 💕</h1>
        
        <div class="buttons">
            <button class="btn btn-yes" onclick="handleYes()">Yes! 💖</button>
            <button class="btn btn-no" onclick="handleNo()">No 💙</button>
        </div>
        
        <div id="message" class="message"></div>
    </div>

    <div class="celebration" id="celebration"></div>

    <script>
        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '💖';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDelay = Math.random() * 6 + 's';
            heart.style.animationDuration = (Math.random() * 3 + 6) + 's';
            document.getElementById('hearts').appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 9000);
        }

        // Create hearts continuously
        setInterval(createHeart, 1000);

        function handleYes() {
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'message happy-message';
            messageDiv.innerHTML = `
                <h2>Yay! 🎉💕</h2>
                <p>Aku sangat bahagia! Terima kasih sudah mau jadi pacarku! ✨</p>
                <p>Kamu sudah membuat hariku jadi sempurna! 🥰💖</p>
            `;
            messageDiv.style.display = 'block';
            
            // Hide buttons
            document.querySelector('.buttons').style.display = 'none';
            
            // Create celebration effects
            createCelebration();
            
            // Change background
            document.body.style.background = 'linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%)';
        }

        function handleNo() {
            const messageDiv = document.getElementById('message');
            messageDiv.className = 'message sad-message';
            messageDiv.innerHTML = `
                <h2>Okedeh... 💙</h2>
                <p>Makasih udah jujur sama aku 😊</p>
                <p>Semoga kita tetap bisa jadi teman baik ya! 🤗</p>
            `;
            messageDiv.style.display = 'block';
            
            // Hide buttons
            document.querySelector('.buttons').style.display = 'none';
            
            // Change background to cooler tones
            document.body.style.background = 'linear-gradient(135deg, #a8edea 0%, #fed6e3 100%)';
        }

        function createCelebration() {
            const celebration = document.getElementById('celebration');
            
            // Create confetti
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.classList.add('confetti');
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.backgroundColor = ['#ff6b6b', '#ffd700', '#ff9a9e', '#74b9ff'][Math.floor(Math.random() * 4)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    celebration.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 100);
            }
            
            // Create sparkles
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const sparkle = document.createElement('div');
                    sparkle.classList.add('sparkle');
                    sparkle.style.left = Math.random() * 100 + 'vw';
                    sparkle.style.top = Math.random() * 100 + 'vh';
                    sparkle.style.animationDelay = Math.random() * 1.5 + 's';
                    celebration.appendChild(sparkle);
                    
                    setTimeout(() => sparkle.remove(), 3000);
                }, i * 200);
            }
        }

        // Initial hearts
        for (let i = 0; i < 5; i++) {
            setTimeout(createHeart, i * 1000);
        }
    </script>
</body>
</html>
